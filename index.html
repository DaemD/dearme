<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7ff" />
    <meta name="description" content="Dear Zeneb - a private place to chat." />
    <title>Dear Zeneb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Caveat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Set dark mode before the first paint so there is no white flash -->
    <script>
      ;(function () {
        try {
          var p = localStorage.getItem("zeneb_lite_theme")
          var dark = p === "dark" || (p !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) document.documentElement.classList.add("dark")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
